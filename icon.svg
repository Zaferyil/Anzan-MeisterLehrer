<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#grad)" rx="80"/>

  <!-- Abacus emoji representation -->
  <text x="256" y="320" font-size="280" text-anchor="middle" fill="#ffffff" style="font-family: sans-serif;">🧮</text>

  <!-- Alternative: AM text -->
  <!-- <text x="256" y="330" font-size="200" text-anchor="middle" fill="#ffffff" font-weight="bold" style="font-family: sans-serif;">AM</text> -->
</svg>
